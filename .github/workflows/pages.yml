name: Deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # BINGO data lives on the bingo-data branch (updated by update-bingo.yml) and
      # is never merged into main. Copy a snapshot into the site; a missing branch
      # must not block deploying the rest of the site.
      - name: Checkout bingo-data
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          ref: bingo-data
          path: bingo-data

      - name: Copy BINGO data into site
        run: |
          if [ -d bingo-data/data/bingo ]; then
            mkdir -p docs/assets/data/bingo
            cp bingo-data/data/bingo/latest.json bingo-data/data/bingo/history.json bingo-data/data/bingo/stats.json docs/assets/data/bingo/
            echo "Included bingo-data@$(git -C bingo-data rev-parse --short HEAD)"
          else
            echo "::warning::bingo-data branch or data/bingo not found; building without BINGO data."
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install site dependencies
        working-directory: docs
        run: |
          bundle config set path vendor/bundle
          bundle install

      - name: Build site
        working-directory: docs
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
