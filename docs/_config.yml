title: IWBJ
description: I Want Big John
url: "https://cyc6221.github.io"
baseurl: "/I-want-big-John"

# Author info
author: CY
email: s24343162@gmail.com
github_username: cyc6221
github_repository_url: "https://github.com/cyc6221/I-want-big-John"

# Build settings
markdown: kramdown
highlighter: rouge
sass:
  quiet_deps: true
  silence_deprecations:
    - import
    - global-builtin
    - color-functions

plugins:
  - jekyll-sitemap

collections:
  articles:
    output: true
    permalink: /articles/:path/
  list:
    output: true
    permalink: /list/:path/

defaults:
  - scope:
      path: ""
      type: articles
    values:
      layout: page
      toc: false

  - scope:
      path: ""
      type: list
    values:
      layout: page
      toc: false
