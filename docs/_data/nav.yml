# Header navigation. Items with `children` render as a hover dropdown.
# `key` marks a game (draw game or instants): its children double as the sub-page tab strip
# (see _includes/lotto/subnav.html). `exclude` lists URL fragments that stop
# an item from being highlighted when the URL contains one of them.
- title: 威力彩
  key: "638"
  url: /638/
  children:
    - { title: 總覽, url: /638/ }
    - { title: 抽一組, url: /638/pick/ }
    - { title: 統計資訊, url: /638/stats/ }
    - { title: 購買紀錄, url: /list/638-purchases/ }
- title: 大樂透
